

name: Laravel CI

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  laravel-tests:
    name: Laravel Tests

    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: testing

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv, mysql
          coverage: none
          tools: composer:v2

      - name: Display PHP and Composer Versions
        run: |
          php --version
          composer --version

      - name: Validate Composer Configuration
        run: composer validate --no-check-publish

      - name: Copy Environment Configuration File
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Set Testing Environment Variables
        run: |
          echo "APP_ENV=testing" >> "$GITHUB_ENV"
          echo "APP_DEBUG=true" >> "$GITHUB_ENV"
          echo "DB_CONNECTION=mysql" >> "$GITHUB_ENV"
          echo "DB_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "DB_PORT=3306" >> "$GITHUB_ENV"
          echo "DB_DATABASE=testing" >> "$GITHUB_ENV"
          echo "DB_USERNAME=root" >> "$GITHUB_ENV"
          echo "DB_PASSWORD=" >> "$GITHUB_ENV"

      - name: Install Composer Dependencies
        run: |
          composer install \
            --no-ansi \
            --no-interaction \
            --no-progress \
            --prefer-dist \
            --no-scripts

      - name: Generate Application Key
        run: php artisan key:generate --ansi

      - name: Run Database Migrations
        run: php artisan migrate --force --ansi

      - name: Execute Automated Test Suite
        run: php artisan test --ansi
        